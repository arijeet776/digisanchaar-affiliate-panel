server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # Static assets are content-hashed by Vite — cache hard; index.html must not be.
  # (add_header in a location replaces the server-level ones, so security headers are repeated.)
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; add_header Referrer-Policy no-referrer always; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; add_header Referrer-Policy no-referrer always; }

  location = /healthz { access_log off; return 200 "ok"; }

  # Same-origin API: the browser calls /api/v1/... and nginx forwards it.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # nginx is the public edge here, so OVERWRITE (don't append to) any
    # client-supplied X-Forwarded-For — otherwise a client could spoof its IP
    # to the rate limiter / fraud checks. If another trusted load balancer sits
    # in front of this nginx, switch to $proxy_add_x_forwarded_for and configure
    # real_ip (ngx_http_realip_module) for that balancer.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback
  location / { try_files $uri $uri/ /index.html; }
}
