# Portable compose file: backend + frontend. MongoDB and PostgreSQL are
# EXTERNAL (e.g. Atlas / Supabase / your own servers) and are configured only
# through backend/.env (copy backend/.env.example). No secrets live in this file.
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # The backend is NOT published on a host port (see `expose` below); only
      # the frontend/nginx container can reach it, and nginx overwrites
      # X-Forwarded-For. Trusting that one hop lets uvicorn report the real
      # client IP. Tighten to the nginx container address if you prefer.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
    restart: unless-stopped
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on: [backend]
    restart: unless-stopped
    ports: ["8080:80"]
